<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're unsubscribed</title>
<style>body{font-family:Arial,sans-serif;max-width:520px;margin:60px auto;padding:0 16px;color:#222}button{padding:8px 14px}</style>

  <button>Undo unsubscribe</button>
</form>
